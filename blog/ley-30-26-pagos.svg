<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="title desc">
  <title id="title">Qué pagos al exterior cubre la tasa del 15 por ciento</title>
  <desc id="desc">Publicidad en línea, licencias de software y derechos de uso o almacenamiento de datos están entre los conceptos con retención especial. Otros pagos pueden conservar la tasa general.</desc>
  <rect width="720" height="430" rx="22" fill="#0f1a18"/>
  <text x="36" y="55" fill="#e9f1ed" font-family="Arial,sans-serif" font-size="25" font-weight="700">Pagos al exterior: revisa el concepto</text>
  <rect x="35" y="90" width="650" height="205" rx="15" fill="#1d302b"/>
  <text x="56" y="136" fill="#ff9b59" font-family="Arial,sans-serif" font-size="28" font-weight="700">15 %</text>
  <text x="154" y="136" fill="#e9f1ed" font-family="Arial,sans-serif" font-size="20">Publicidad en línea</text>
  <text x="154" y="193" fill="#e9f1ed" font-family="Arial,sans-serif" font-size="20">Licencias de software</text>
  <text x="154" y="250" fill="#e9f1ed" font-family="Arial,sans-serif" font-size="20">Uso o almacenamiento de datos</text>
  <path d="M56 157h603M56 214h603" stroke="#355147" stroke-width="2"/>
  <rect x="35" y="311" width="650" height="77" rx="15" fill="#27342f"/>
  <text x="56" y="346" fill="#e9f1ed" font-family="Arial,sans-serif" font-size="19" font-weight="700">Otros conceptos</text>
  <text x="56" y="372" fill="#c9d9d3" font-family="Arial,sans-serif" font-size="17">La tasa general puede seguir en 27 %.</text>
</svg>
