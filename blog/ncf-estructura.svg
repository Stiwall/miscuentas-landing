<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Cómo se lee un NCF de la serie B</title>
  <desc id="desc">El ejemplo B0100000522 se divide en serie B, tipo 01 y secuencia 00000522.</desc>
  <rect width="720" height="360" rx="22" fill="#0f1a18"/>
  <text x="36" y="56" fill="#e9f1ed" font-family="Arial,sans-serif" font-size="25" font-weight="700">Lee un NCF en tres partes</text>
  <rect x="35" y="88" width="650" height="90" rx="14" fill="#1d302b"/>
  <text x="74" y="150" fill="#ff9b59" font-family="Arial,sans-serif" font-size="54" font-weight="700">B</text>
  <text x="151" y="150" fill="#e9f1ed" font-family="Arial,sans-serif" font-size="54" font-weight="700">01</text>
  <text x="283" y="150" fill="#e9f1ed" font-family="Arial,sans-serif" font-size="54" font-weight="700">00000522</text>
  <path d="M92 188v27m87-27v27m275-27v27" stroke="#ff7c2a" stroke-width="3"/>
  <text x="40" y="258" fill="#ff9b59" font-family="Arial,sans-serif" font-size="25" font-weight="700">B</text>
  <text x="40" y="289" fill="#c9d9d3" font-family="Arial,sans-serif" font-size="18">Serie</text>
  <text x="150" y="258" fill="#ff9b59" font-family="Arial,sans-serif" font-size="25" font-weight="700">01</text>
  <text x="150" y="289" fill="#c9d9d3" font-family="Arial,sans-serif" font-size="18">Tipo: crédito fiscal</text>
  <text x="410" y="258" fill="#ff9b59" font-family="Arial,sans-serif" font-size="25" font-weight="700">00000522</text>
  <text x="410" y="289" fill="#c9d9d3" font-family="Arial,sans-serif" font-size="18">Número secuencial</text>
</svg>
