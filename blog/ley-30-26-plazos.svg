<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="title desc">
  <title id="title">Fechas de tres medidas de la Ley 30-26</title>
  <desc id="desc">La retención especial a ciertos pagos al exterior y el nuevo recargo empiezan el 1 de julio de 2026. La amnistía vence el 31 de diciembre de 2026.</desc>
  <rect width="720" height="460" rx="22" fill="#0f1a18"/>
  <text x="36" y="54" fill="#e9f1ed" font-family="Arial,sans-serif" font-size="25" font-weight="700">Tres fechas para revisar</text>
  <path d="M72 105v292" stroke="#ff7c2a" stroke-width="4"/>
  <circle cx="72" cy="137" r="12" fill="#ff7c2a"/>
  <text x="108" y="143" fill="#ff9b59" font-family="Arial,sans-serif" font-size="23" font-weight="700">1 de julio de 2026</text>
  <text x="108" y="176" fill="#e9f1ed" font-family="Arial,sans-serif" font-size="20">Retención especial del 15 %</text>
  <text x="108" y="204" fill="#c9d9d3" font-family="Arial,sans-serif" font-size="17">Solo para los conceptos que cubre la ley.</text>
  <circle cx="72" cy="267" r="12" fill="#ff7c2a"/>
  <text x="108" y="273" fill="#ff9b59" font-family="Arial,sans-serif" font-size="23" font-weight="700">1 de julio de 2026</text>
  <text x="108" y="306" fill="#e9f1ed" font-family="Arial,sans-serif" font-size="20">Recargo por mora del 3 % mensual</text>
  <circle cx="72" cy="369" r="12" fill="#ff7c2a"/>
  <text x="108" y="375" fill="#ff9b59" font-family="Arial,sans-serif" font-size="23" font-weight="700">31 de diciembre de 2026</text>
  <text x="108" y="408" fill="#e9f1ed" font-family="Arial,sans-serif" font-size="20">Fin de la amnistía fiscal</text>
</svg>
