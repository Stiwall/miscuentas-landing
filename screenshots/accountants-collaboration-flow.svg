<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" width="1400" height="600"
     role="img" aria-labelledby="colTitle colDesc">
  <title id="colTitle">Flujo de colaboración entre la empresa, MisCuentas y su contador</title>
  <desc id="colDesc">El negocio registra sus operaciones del día. MisCuentas las organiza y
    conecta con inventario, cobros y contabilidad. El contador entra desde su panel
    multiempresa, revisa, corrige y cierra. Los dos consultan los mismos resultados.</desc>

  <style>
    .caja  { fill:#0C1320; stroke:rgba(249,115,22,.28); stroke-width:1.5 }
    .nucleo{ fill:#0E1A2B; stroke:rgba(249,115,22,.55); stroke-width:2 }
    .ico   { fill:none; stroke:#F97316; stroke-width:2; stroke-linecap:round; stroke-linejoin:round }
    .tit   { fill:#F1F5FF; font-family:Outfit,system-ui,sans-serif; font-size:19px; font-weight:700 }
    .sub   { fill:#94A3C0; font-family:Outfit,system-ui,sans-serif; font-size:13px }
    .rol   { fill:#4A5872; font-family:Outfit,system-ui,sans-serif; font-size:11.5px;
             letter-spacing:.9px; font-weight:700 }
    .flecha{ stroke:rgba(249,115,22,.42); stroke-width:1.8; fill:none; marker-end:url(#punta) }
    .vuelta{ stroke:rgba(16,185,129,.45); stroke-width:1.8; fill:none; stroke-dasharray:6 6;
             marker-end:url(#puntaV) }
    .etiq  { fill:#94A3C0; font-family:Outfit,system-ui,sans-serif; font-size:12.5px }
    .etiqV { fill:#10B981; font-family:Outfit,system-ui,sans-serif; font-size:12.5px; font-weight:600 }
  </style>

  <defs>
    <marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="rgba(249,115,22,.65)"/>
    </marker>
    <marker id="puntaV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="rgba(16,185,129,.7)"/>
    </marker>
  </defs>

  <rect width="1400" height="600" fill="#04080F"/>

  <!-- el negocio, arriba a la izquierda -->
  <g transform="translate(60,90)">
    <rect class="caja" x="0" y="0" width="320" height="150" rx="14"/>
    <text class="rol" x="24" y="34">EL NEGOCIO</text>
    <g class="ico" transform="translate(258,22)">
      <path d="M2 20V8l10-6 10 6v12"/><path d="M2 20h20M9 20v-6h6v6"/>
    </g>
    <text class="tit" x="24" y="72">Registra el día</text>
    <text class="sub" x="24" y="98">Factura, cobra y anota lo</text>
    <text class="sub" x="24" y="118">que compra. Nada más.</text>
  </g>

  <!-- el contador, abajo a la izquierda -->
  <g transform="translate(60,360)">
    <rect class="caja" x="0" y="0" width="320" height="150" rx="14"/>
    <text class="rol" x="24" y="34">EL CONTADOR</text>
    <g class="ico" transform="translate(258,22)">
      <path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/>
    </g>
    <text class="tit" x="24" y="72">Revisa y cierra</text>
    <text class="sub" x="24" y="98">Entra a cada empresa desde</text>
    <text class="sub" x="24" y="118">su panel, sin pedir archivos.</text>
  </g>

  <!-- el nucleo -->
  <g transform="translate(520,180)">
    <rect class="nucleo" x="0" y="0" width="340" height="240" rx="16"/>
    <g class="ico" transform="translate(148,34)">
      <path d="M22 2H6a2 2 0 00-2 2v22a2 2 0 002 2h16a2 2 0 002-2V8z"/><path d="M22 2v6h6"/>
      <path d="M9 16h10M9 22h7"/>
    </g>
    <text class="tit" x="0" y="120" text-anchor="middle" transform="translate(170,0)">MisCuentas</text>
    <text class="sub" x="170" y="150" text-anchor="middle">Conecta la factura con el</text>
    <text class="sub" x="170" y="170" text-anchor="middle">inventario, el cobro y el asiento</text>
    <text class="sub" x="170" y="196" text-anchor="middle">Tres papeles: admin, contador,</text>
    <text class="sub" x="170" y="214" text-anchor="middle">cajero</text>
  </g>

  <!-- resultados, a la derecha -->
  <g transform="translate(1000,180)">
    <rect class="caja" x="0" y="0" width="340" height="240" rx="16"/>
    <text class="rol" x="26" y="38">LOS DOS MIRAN LO MISMO</text>
    <g class="ico" transform="translate(278,24)">
      <path d="M2 20V10M9 20V4M16 20v-7M23 20V8"/>
    </g>
    <text class="tit" x="26" y="86">Los mismos números</text>
    <text class="sub" x="26" y="118">Estado de Resultados y balanza</text>
    <text class="sub" x="26" y="140">Cierre mensual y anual</text>
    <text class="sub" x="26" y="162">606, 607 y 608 con su NCF</text>
    <text class="sub" x="26" y="184">Exportado a CSV cuando haga falta</text>
    <text class="sub" x="26" y="214" style="fill:#4A5872">Sin una versión para cada uno.</text>
  </g>

  <!-- flechas de entrada -->
  <path class="flecha" d="M380 165 C 450 165, 450 240, 514 240"/>
  <path class="flecha" d="M380 435 C 450 435, 450 360, 514 360"/>
  <text class="etiq" x="404" y="196">registra</text>
  <text class="etiq" x="404" y="418">revisa y corrige</text>

  <!-- salida a resultados -->
  <path class="flecha" d="M860 300 L 994 300"/>
  <text class="etiq" x="927" y="286" text-anchor="middle">organiza</text>

  <!-- La vuelta iba dibujada del resultado al nucleo, y lo que dice la frase es que
       la MIRAN los dos. Como flecha confundia; se queda como nota. -->
  <text class="etiqV" x="700" y="540" text-anchor="middle">Los dos miran el mismo número, en el momento, sin mandarse un archivo.</text>
</svg>
